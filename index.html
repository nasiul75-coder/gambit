<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAMBIT — 3D Multiplayer Chess</title>

  <!-- Google Fonts: Montserrat (Wordmark) & Inter (UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            brand: ['Montserrat', 'Inter', 'sans-serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            champagne: {
              DEFAULT: '#d4af6a',
              hover: '#dfc084',
              dark: '#b89149',
            }
          }
        }
      }
    };
  </script>

  <!-- Three.js r128 CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg-top: #1d222b;
      --bg-bottom: #2a313d;
      --card-bg: rgba(26, 31, 40, 0.78);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-primary: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #d4af6a;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Full-Viewport WebGL Canvas */
    #sceneCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
      outline: none;
    }

    /* Balanced Smoked Slate Glass (Lightweight 10px Blur for 60fps) */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      box-shadow: 0 24px 48px -16px rgba(8, 10, 15, 0.52);
    }

    .glass-bar {
      background: rgba(24, 29, 38, 0.80);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
    }

    /* Intro Synchronized Wordmark */
    #introWordmarkOverlay {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: clamp(13vh, 18vh, 22vh);
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.45s var(--ease-out);
    }

    .intro-wordmark {
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: clamp(1.35rem, 3vw, 2.2rem);
      letter-spacing: 0.78em;
      padding-left: 0.78em;
      color: #f3f4f6;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.55s var(--ease-out), transform 0.65s var(--ease-out), letter-spacing 0.75s var(--ease-out), padding-left 0.75s var(--ease-out);
    }

    .intro-wordmark.revealed {
      opacity: 1;
      transform: translateY(0);
      letter-spacing: 0.52em;
      padding-left: 0.52em;
    }

    /* GPU-Composited View Transitions */
    .view-layer {
      will-change: opacity, transform;
      transition: opacity 0.55s var(--ease-out), transform 0.6s var(--ease-out), visibility 0.55s;
    }

    .view-hidden {
      opacity: 0;
      transform: translateY(16px);
      visibility: hidden;
      pointer-events: none;
    }

    .view-active {
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
      pointer-events: auto;
    }

    /* Sliding Pill Tab Switcher */
    .tab-pill {
      transition: transform 0.36s var(--ease-out);
    }

    /* Collapsible Username Field */
    .collapsible-field {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      margin-bottom: 0;
      transition: grid-template-rows 0.34s var(--ease-out), opacity 0.24s ease, margin-bottom 0.34s var(--ease-out);
    }

    .collapsible-field.open {
      grid-template-rows: 1fr;
      opacity: 1;
      margin-bottom: 0.875rem;
    }

    .collapsible-inner {
      overflow: hidden;
    }

    /* Inputs */
    .slate-input {
      background: rgba(17, 21, 28, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.11);
      color: #f3f4f6;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .slate-input::placeholder {
      color: #6b7280;
    }

    .slate-input:focus {
      outline: none;
      background: rgba(17, 21, 28, 0.92);
      border-color: var(--accent);
    }

    /* Buttons */
    .btn-primary {
      background: linear-gradient(135deg, #dfc084 0%, #d4af6a 55%, #b89149 100%);
      color: #161a22;
      transition: transform 0.2s var(--ease-out), filter 0.2s ease;
    }

    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-google {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.13);
      color: #f3f4f6;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .btn-google:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.11);
      border-color: rgba(212, 175, 106, 0.45);
    }

    /* Lobby Mode Card Hover */
    .mode-card {
      transition: transform 0.25s var(--ease-out), border-color 0.22s ease, background-color 0.22s ease;
    }

    .mode-card:hover {
      transform: translateY(-3px);
      background: rgba(34, 41, 53, 0.86);
      border-color: rgba(212, 175, 106, 0.45);
    }

    /* Spinner */
    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 9999px;
      animation: spin 0.65s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Minimal Toast Transitions */
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes toastOut {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(20px); }
    }

    .toast-in { animation: toastIn 0.3s var(--ease-out) forwards; }
    .toast-out { animation: toastOut 0.22s ease forwards; }
  </style>
</head>

<body class="selection:bg-champagne/25 selection:text-white">

  <!-- Full-Viewport Three.js WebGL Canvas -->
  <canvas id="sceneCanvas" aria-label="GAMBIT 3D Chess Arena"></canvas>

  <!-- Synchronized 3D Intro Wordmark (Hidden once intro completes) -->
  <div id="introWordmarkOverlay" aria-hidden="true">
    <div id="introWordmarkText" class="intro-wordmark">GAMBIT</div>
  </div>

  <!-- Minimal Toast Container -->
  <div id="toastContainer" class="fixed top-5 right-4 sm:right-6 z-50 flex flex-col gap-2.5 w-[calc(100vw-2rem)] max-w-sm pointer-events-none"></div>

  <!-- =========================================================
       VIEW 1: MINIMAL PRODUCTION LOGIN SCREEN
  ========================================================== -->
  <main id="authView" class="view-layer view-hidden relative z-10 min-h-screen flex items-center justify-center lg:justify-end px-4 py-8 sm:px-8 lg:px-16">
    <div class="glass-card w-full max-w-[400px] rounded-2xl p-6 sm:p-8 relative">

      <!-- Subtle Top Champagne Accent Line -->
      <div class="absolute top-0 inset-x-10 h-px bg-gradient-to-r from-transparent via-champagne/60 to-transparent"></div>

      <!-- Brand Header: Exact 4-Ring G + Chess King SVG & GAMBIT Wordmark -->
      <div class="flex flex-col items-center mb-6">
        <div class="w-14 h-14 flex items-center justify-center mb-2.5">
          <svg viewBox="0 0 100 100" class="w-full h-full" fill="none" aria-label="GAMBIT Logo">
            <!-- 4 Concentric C/G Arcs with clean radial gaps + Outer Horizontal Crossbar -->
            <path d="M 79.4 20.6 A 41.6 41.6 0 1 0 91.6 50 L 50 50" stroke="#f3f4f6" stroke-width="3.2" stroke-linecap="butt" stroke-linejoin="miter" />
            <path d="M 74.6 25.4 A 34.8 34.8 0 1 0 84.3 55.5" stroke="#f3f4f6" stroke-width="3.2" stroke-linecap="butt" />
            <path d="M 69.8 30.2 A 28.0 28.0 0 1 0 77.4 55.5" stroke="#f3f4f6" stroke-width="3.2" stroke-linecap="butt" />
            <path d="M 65.0 35.0 A 21.2 21.2 0 1 0 70.5 55.4" stroke="#f3f4f6" stroke-width="3.2" stroke-linecap="butt" />
            <!-- Sculpted Chess King cleanly perched on top of the horizontal bar -->
            <g fill="#d4af6a">
              <rect x="74.9" y="21.0" width="2.2" height="6.8" rx="0.5" />
              <rect x="72.6" y="23.2" width="6.8" height="2.2" rx="0.5" />
              <path d="M 71.7 39.2 L 70.1 32.2 C 69.6 29.8 71.4 27.9 73.7 27.9 L 78.3 27.9 C 80.6 27.9 82.4 29.8 81.9 32.2 L 80.3 39.2 Z" />
              <rect x="70.8" y="40.3" width="10.4" height="2.0" rx="1.0" />
              <path d="M 69.4 46.2 C 69.4 44.3 70.9 43.3 72.6 43.3 L 79.4 43.3 C 81.1 43.3 82.6 44.3 82.6 46.2 Z" />
            </g>
          </svg>
        </div>
        <h1 class="font-brand text-xl font-semibold tracking-[0.38em] pl-[0.38em] text-[#f3f4f6]">
          GAMBIT
        </h1>
      </div>

      <!-- Sliding Pill Tab Switcher -->
      <div class="relative grid grid-cols-2 p-1 rounded-xl bg-black/25 border border-white/10 mb-5" role="tablist">
        <div id="tabPill" class="tab-pill absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] rounded-lg bg-white/12"></div>
        <button
          type="button"
          id="tabSignIn"
          role="tab"
          aria-selected="true"
          class="relative z-10 py-2 text-xs sm:text-sm font-semibold rounded-lg text-[#f3f4f6] transition-colors cursor-pointer"
        >
          Sign In
        </button>
        <button
          type="button"
          id="tabSignUp"
          role="tab"
          aria-selected="false"
          class="relative z-10 py-2 text-xs sm:text-sm font-medium rounded-lg text-[#9ca3af] transition-colors cursor-pointer"
        >
          Sign Up
        </button>
      </div>

      <!-- Continue with Google Button -->
      <button
        type="button"
        id="googleAuthBtn"
        class="btn-google w-full py-2.5 px-4 rounded-xl flex items-center justify-center gap-3 text-sm font-medium cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span id="googleBtnText">Continue with Google</span>
      </button>

      <!-- Subtle Divider -->
      <div class="relative flex items-center my-5">
        <div class="flex-grow border-t border-white/10"></div>
        <span class="px-3 text-xs text-[#9ca3af]">or</span>
        <div class="flex-grow border-t border-white/10"></div>
      </div>

      <!-- Auth Form -->
      <form id="authForm" novalidate>

        <!-- Username (Sign Up Only) -->
        <div id="usernameCollapse" class="collapsible-field">
          <div class="collapsible-inner">
            <label for="usernameInput" class="block text-xs font-medium text-[#9ca3af] mb-1.5">
              Username
            </label>
            <input
              id="usernameInput"
              type="text"
              autocomplete="username"
              maxlength="24"
              placeholder="Choose a username"
              class="slate-input w-full rounded-xl px-3.5 py-2.5 text-sm"
            />
          </div>
        </div>

        <!-- Email -->
        <div class="mb-3.5">
          <label for="emailInput" class="block text-xs font-medium text-[#9ca3af] mb-1.5">
            Email
          </label>
          <input
            id="emailInput"
            type="email"
            required
            autocomplete="email"
            placeholder="name@example.com"
            class="slate-input w-full rounded-xl px-3.5 py-2.5 text-sm"
          />
        </div>

        <!-- Password -->
        <div class="mb-5">
          <div class="flex items-center justify-between mb-1.5">
            <label for="passwordInput" class="block text-xs font-medium text-[#9ca3af]">
              Password
            </label>
            <button
              type="button"
              id="forgotPasswordBtn"
              class="text-xs font-medium text-champagne hover:text-champagne-hover transition-colors cursor-pointer"
            >
              Forgot password?
            </button>
          </div>
          <div class="relative">
            <input
              id="passwordInput"
              type="password"
              required
              autocomplete="current-password"
              placeholder="Enter your password"
              class="slate-input w-full rounded-xl pl-3.5 pr-11 py-2.5 text-sm"
            />
            <button
              type="button"
              id="togglePasswordBtn"
              aria-label="Toggle password visibility"
              class="absolute right-2.5 top-1/2 -translate-y-1/2 p-1.5 rounded-lg text-[#9ca3af] hover:text-[#f3f4f6] transition-colors cursor-pointer"
            >
              <svg id="eyeOpenIcon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg id="eyeClosedIcon" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                <line x1="2" y1="2" x2="22" y2="22" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="submitAuthBtn"
          class="btn-primary w-full py-2.5 px-4 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 cursor-pointer disabled:opacity-55 disabled:cursor-not-allowed"
        >
          <span id="submitBtnText">Sign In</span>
        </button>
      </form>
    </div>
  </main>

  <!-- =========================================================
       VIEW 2: AUTHENTICATED GAMBIT LOBBY
  ========================================================== -->
  <section id="lobbyView" class="view-layer view-hidden fixed inset-0 z-20 flex flex-col justify-between pointer-events-none">

    <!-- Minimal Top Bar -->
    <header class="glass-bar pointer-events-auto">
      <div class="max-w-7xl mx-auto px-4 sm:px-8 py-3 flex items-center justify-between gap-3">
        <!-- Brand -->
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 flex items-center justify-center">
            <svg viewBox="0 0 100 100" class="w-full h-full" fill="none" aria-label="GAMBIT Logo">
              <path d="M 79.4 20.6 A 41.6 41.6 0 1 0 91.6 50 L 50 50" stroke="#f3f4f6" stroke-width="3.6" stroke-linecap="butt" stroke-linejoin="miter" />
              <path d="M 74.6 25.4 A 34.8 34.8 0 1 0 84.3 55.5" stroke="#f3f4f6" stroke-width="3.6" stroke-linecap="butt" />
              <path d="M 69.8 30.2 A 28.0 28.0 0 1 0 77.4 55.5" stroke="#f3f4f6" stroke-width="3.6" stroke-linecap="butt" />
              <path d="M 65.0 35.0 A 21.2 21.2 0 1 0 70.5 55.4" stroke="#f3f4f6" stroke-width="3.6" stroke-linecap="butt" />
              <g fill="#d4af6a">
                <rect x="74.9" y="21.0" width="2.2" height="6.8" rx="0.5" />
                <rect x="72.6" y="23.2" width="6.8" height="2.2" rx="0.5" />
                <path d="M 71.7 39.2 L 70.1 32.2 C 69.6 29.8 71.4 27.9 73.7 27.9 L 78.3 27.9 C 80.6 27.9 82.4 29.8 81.9 32.2 L 80.3 39.2 Z" />
                <rect x="70.8" y="40.3" width="10.4" height="2.0" rx="1.0" />
                <path d="M 69.4 46.2 C 69.4 44.3 70.9 43.3 72.6 43.3 L 79.4 43.3 C 81.1 43.3 82.6 44.3 82.6 46.2 Z" />
              </g>
            </svg>
          </div>
          <span class="font-brand text-sm sm:text-base font-semibold tracking-[0.34em] text-[#f3f4f6]">
            GAMBIT
          </span>
        </div>

        <!-- Profile, ELO & Sign Out -->
        <div class="flex items-center gap-2.5 sm:gap-3">
          <!-- ELO 1200 Badge -->
          <div class="hidden sm:flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-champagne/15 border border-champagne/30">
            <svg class="w-3.5 h-3.5 text-champagne" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
            </svg>
            <span class="text-xs font-semibold text-champagne tracking-wide">1200 ELO</span>
          </div>

          <!-- User Avatar & Display Name -->
          <div class="flex items-center gap-2.5 pl-1.5 pr-3 py-1 rounded-xl bg-white/5 border border-white/10">
            <img
              id="lobbyAvatarImg"
              src=""
              alt="Player Avatar"
              class="hidden w-7 h-7 rounded-lg object-cover"
            />
            <div
              id="lobbyAvatarInitials"
              class="w-7 h-7 rounded-lg bg-champagne text-[#161a22] font-bold text-xs flex items-center justify-center"
            >
              GM
            </div>
            <span id="lobbyUserName" class="text-xs font-semibold text-[#f3f4f6] max-w-[110px] sm:max-w-[160px] truncate">
              Player
            </span>
          </div>

          <!-- Sign Out -->
          <button
            type="button"
            id="signOutBtn"
            class="btn-google inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-medium cursor-pointer"
          >
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            <span class="hidden sm:inline">Sign Out</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Bottom Mode Selector Cards -->
    <footer class="pointer-events-auto w-full max-w-6xl mx-auto px-4 sm:px-8 pb-6 sm:pb-8">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3.5">

        <!-- Blitz 3+2 -->
        <button
          type="button"
          data-mode="Blitz 3+2"
          class="mode-card glass-card text-left rounded-2xl p-4 sm:p-5 flex items-center justify-between gap-4 cursor-pointer group"
        >
          <div class="flex items-center gap-3.5">
            <div class="w-10 h-10 rounded-xl bg-champagne/15 border border-champagne/30 flex items-center justify-center text-champagne shrink-0">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
              </svg>
            </div>
            <div>
              <div class="text-sm font-semibold text-[#f3f4f6]">Blitz 3+2</div>
              <div class="text-xs text-[#9ca3af] mt-0.5">3 min + 2 sec</div>
            </div>
          </div>
          <svg class="w-4 h-4 text-[#9ca3af] group-hover:text-champagne group-hover:translate-x-0.5 transition-all shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </button>

        <!-- Rapid 10+0 -->
        <button
          type="button"
          data-mode="Rapid 10+0"
          class="mode-card glass-card text-left rounded-2xl p-4 sm:p-5 flex items-center justify-between gap-4 cursor-pointer group"
        >
          <div class="flex items-center gap-3.5">
            <div class="w-10 h-10 rounded-xl bg-white/5 border border-white/12 flex items-center justify-center text-[#f3f4f6] group-hover:text-champagne transition-colors shrink-0">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

          shape.lineTo(0.0, halfH);

        { id: "bB2", t: "B", s: "black", f: 2, r: 7 },
        { id: "bN1", t: "N", s: "black", f: 5, r: 5 },
        { id: "bN2", t: "N", s: "black", f: 1, r: 6 },
        { id: "bP1", t: "P", s: "black", f: 3, r: 4 },
        { id: "bP2", t: "P", s: "black", f: 4, r: 5 },
        { id: "bP3", t: "P", s: "black", f: 2, r: 5 },
        { id: "bP4", t: "P", s: "black", f: 6, r: 6 },
        { id: "bP5", t: "P", s: "black", f: 7, r: 6 }
      ];

      layout.forEach((p) => {
        const mesh = createPieceMesh(p.t, p.s);
        mesh.position.copy(gridToWorld(p.f, p.r));
        arenaGroup.add(mesh);
        piecesMap.set(p.id, { mesh });
      });

      // Gentle Automated Chess Exhibition Moves
      const moveQueue = [
        { id: "wN2", f: 4, r: 4 },
        { id: "bQ",  f: 2, r: 6 },
        { id: "wB1", f: 5, r: 3 },
        { id: "bN1", f: 3, r: 6 },
        { id: "wB1", f: 2, r: 0 },
        { id: "bN1", f: 5, r: 5 },
        { id: "wN2", f: 5, r: 2 },
        { id: "bQ",  f: 3, r: 7 }
      ];
      let moveIdx = 0;
      let moveDelay = 2.0;
      let activeMove = null;

      // Ultra-Lightweight Ambient Dust Particles (26 particles max)
      const dustCount = 26;
      const dustPos = new Float32Array(dustCount * 3);
      for (let i = 0; i < dustCount; i++) {
        dustPos[i * 3] = (Math.random() - 0.5) * 14;
        dustPos[i * 3 + 1] = 0.5 + Math.random() * 6.5;
        dustPos[i * 3 + 2] = (Math.random() - 0.5) * 14;
      }
      const dustGeo = new THREE.BufferGeometry();
      dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3));
      const dustMat = new THREE.PointsMaterial({
        color: 0xd4af6a,
        size: 0.055,
        transparent: true,
        opacity: 0.35,
        depthWrite: false
      });
      const dustPoints = new THREE.Points(dustGeo, dustMat);
      arenaGroup.add(dustPoints);

      // ---------------------------------------------------------
      // POINTER PARALLAX & RESIZE
      // ---------------------------------------------------------
      const pointer = { x: 0, y: 0, sx: 0, sy: 0 };
      window.addEventListener("pointermove", (e) => {
        pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
        pointer.y = (e.clientY / window.innerHeight) * 2 - 1;
      }, { passive: true });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // ---------------------------------------------------------
      // EASING & STRICT ANTI-MERGE TIMELINE
      // ---------------------------------------------------------
      const clamp01 = (v) => Math.max(0, Math.min(1, v));
      const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
      const easeOutExpo = (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t));
      const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

      // Initial Intro Camera Pose (Framed exclusively on 3D Logo)
      const camPos = new THREE.Vector3(-1.8, 0.8, 8.2);
      const camLook = new THREE.Vector3(0, 0.25, 0);
      const targetPos = new THREE.Vector3();
      const targetLook = new THREE.Vector3();
      camera.position.copy(camPos);
      camera.lookAt(camLook);

      let introTime = 0;
      let wordmarkShown = false;
      let arenaReveal = 0;

      // ---------------------------------------------------------
      // VISIBILITY PAUSE + 60FPS ANIMATION LOOP
      // ---------------------------------------------------------
      const clock = new THREE.Clock();
      let rafId = null;

      function animate() {
        rafId = requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        const elapsed = clock.getElapsedTime();

        const dampPtr = 1 - Math.exp(-4.5 * dt);
        pointer.sx += (pointer.x - pointer.sx) * dampPtr;
        pointer.sy += (pointer.y - pointer.sy) * dampPtr;

        if (sceneState.phase === "intro") {
          introTime += dt;

          // 0.00s - 1.05s: 4 concentric 3D arcs smoothly align (with preserved radial gaps)
          logoArcs.forEach((arc, i) => {
            const p = easeOutExpo(clamp01((introTime - i * 0.08) / 0.88));
            const s = 0.72 + 0.28 * p;
            arc.scale.set(s, s, 0.4 + 0.6 * p);
            arc.rotation.z = (1 - p) * (-0.42 - i * 0.1);
            arc.position.z = (1 - p) * (-1.1 - i * 0.18);
          });

          // 0.60s - 1.38s: 3D Chess King glides cleanly onto horizontal crossbar
          const kingP = easeOutCubic(clamp01((introTime - 0.60) / 0.78));
          logoKing.visible = introTime >= 0.58;
          logoKing.position.set(
            KING_REST_X,
            KING_REST_Y + (1 - kingP) * 1.9,
            0
          );
          logoKing.rotation.y = (1 - kingP) * Math.PI * 0.9;

          // 0.95s: Reveal clean GAMBIT wordmark below 3D logo
          if (introTime >= 0.95 && !wordmarkShown) {
            wordmarkShown = true;
            introWordmarkText.classList.add("revealed");
          }

          // Subtle studio rotation of 3D mark
          logoGroup.rotation.y = Math.sin(introTime * 0.9) * 0.08 + pointer.sx * 0.1;

          // 1.90s - 2.48s: Clean fade & glide out of 3D Logo BEFORE board ever appears
          if (introTime >= 1.90) {
            const outP = easeInOutCubic(clamp01((introTime - 1.90) / 0.58));
            const sOut = 1 - outP * 0.14;
            logoGroup.scale.set(sOut, sOut, sOut);
            logoGroup.position.y = 0.35 + outP * 0.9;
            logoArcMat.opacity = 1 - outP;
            logoKingMat.opacity = 1 - outP;
            introWordmarkOverlay.style.opacity = String(1 - outP);
          }

          // Intro camera glide
          const camP = easeOutCubic(clamp01(introTime / 1.25));
          targetPos.set(-1.8 * (1 - camP) + pointer.sx * 0.25, 0.8 * (1 - camP) + 0.35, 8.2 - 1.0 * camP);
          targetLook.set(0, 0.25, 0);
          const camDamp = 1 - Math.exp(-5.0 * dt);
          camPos.lerp(targetPos, camDamp);
          camLook.lerp(targetLook, camDamp);
          camera.position.copy(camPos);
          camera.lookAt(camLook);

          // 2.50s: Hard separation — completely hide logoGroup, then reveal 3D Chess Arena + UI
          if (introTime >= 2.50) {
            logoGroup.visible = false;
            introWordmarkOverlay.style.display = "none";

            // Snap camera smoothly to Arena start pose so there is zero logo/board merge
            const isDesktop = window.innerWidth >= 1024;
            const offsetX = currentScreen === "lobby" ? 0 : (isDesktop ? 1.85 : 0);
            camPos.set(currentScreen === "lobby" ? 0 : -2.6 + offsetX * 0.4, 6.2, 10.6);
            camLook.set(offsetX, 0.3, 0.1);
            camera.position.copy(camPos);
            camera.lookAt(camLook);

            arenaGroup.visible = true;
            arenaGroup.position.y = -0.35;
            arenaGroup.scale.setScalar(0.96);

            introDone = true;
            sceneState.phase = currentScreen;
            syncVisibleView();
          }
        } else {
          // ARENA PHASE ("auth" or "lobby")
          if (arenaReveal < 1) {
            arenaReveal = Math.min(1, arenaReveal + dt * 1.65);
            const rEase = easeOutCubic(arenaReveal);
            arenaGroup.position.y = -0.35 * (1 - rEase);
            arenaGroup.scale.setScalar(0.96 + 0.04 * rEase);
          }

          const isDesktop = window.innerWidth >= 1024;
          if (sceneState.phase === "lobby") {
            targetPos.set(
              pointer.sx * 0.75,
              7.2 - pointer.sy * 0.35,
              8.2 + Math.sin(elapsed * 0.22) * 0.14
            );
            targetLook.set(0, 0.2, 0.3);
          } else {
            const offsetX = isDesktop ? 1.85 : 0.0;
            targetPos.set(
              -2.6 + offsetX * 0.4 + pointer.sx * 0.7,
              5.4 - pointer.sy * 0.32,
              9.8 + Math.cos(elapsed * 0.2) * 0.14
            );
            targetLook.set(offsetX, 0.3, 0.1);
          }

          const dampCam = 1 - Math.exp(-3.4 * dt);
          camPos.lerp(targetPos, dampCam);
          camLook.lerp(targetLook, dampCam);
          camera.position.copy(camPos);
          camera.lookAt(camLook);

          // Gentle Automated Parabolic Piece Moves
          if (!activeMove) {
            moveDelay -= dt;
            if (moveDelay <= 0) {
              const spec = moveQueue[moveIdx];
              const entry = piecesMap.get(spec.id);
              if (entry) {
                activeMove = {
                  mesh: entry.mesh,
                  from: entry.mesh.position.clone(),
                  to: gridToWorld(spec.f, spec.r),
                  t: 0,
                  dur: 1.3
                };
              }
              moveIdx = (moveIdx + 1) % moveQueue.length;
            }
          } else {
            activeMove.t += dt / activeMove.dur;
            const p = Math.min(activeMove.t, 1);
            const eased = easeInOutCubic(p);
            activeMove.mesh.position.lerpVectors(activeMove.from, activeMove.to, eased);
            activeMove.mesh.position.y = activeMove.from.y + Math.sin(p * Math.PI) * 1.05;
            if (p >= 1) {
              activeMove.mesh.position.copy(activeMove.to);
              activeMove = null;
              moveDelay = 2.8;
            }
          }

          // Slow ambient rotation of subtle dust
          dustPoints.rotation.y = elapsed * 0.025;
        }

        renderer.render(scene, camera);
      }

      // Pause WebGL completely when tab is hidden
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          if (rafId !== null) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
        } else if (rafId === null) {
          clock.getDelta();
          animate();
        }
      });

      animate();
    }

    window.addEventListener("load", init3DScene);

    // =========================================================
    // 4. MINIMAL SVG TOAST NOTIFICATIONS
    // =========================================================
    const TOAST_ICONS = {
      success: `<svg class="w-4 h-4 text-emerald-400 shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12" /></svg>`,
      error: `<svg class="w-4 h-4 text-rose-400 shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></svg>`,
      info: `<svg class="w-4 h-4 text-champagne shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><line x1="12" y1="16" x2="12" y2="12" /><line x1="12" y1="8" x2="12.01" y2="8" /></svg>`
    };

    function showToast(title, message = "", type = "info", duration = 4200) {
      const el = document.createElement("div");
      el.className = "pointer-events-auto toast-in glass-card rounded-xl px-4 py-3 flex items-start gap-3";
      el.innerHTML = `
        ${TOAST_ICONS[type] || TOAST_ICONS.info}
        <div class="flex-1 min-w-0">
          <div class="text-xs font-semibold text-[#f3f4f6]">${title}</div>
          ${message ? `<div class="text-[11px] text-[#9ca3af] mt-0.5 leading-relaxed">${message}</div>` : ""}
        </div>
        <button type="button" aria-label="Close" class="text-[#9ca3af] hover:text-[#f3f4f6] p-0.5 cursor-pointer">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      `;

      const close = () => {
        el.classList.remove("toast-in");
        el.classList.add("toast-out");
        setTimeout(() => el.remove(), 220);
      };

      el.querySelector("button").addEventListener("click", close);
      toastContainer.appendChild(el);
      if (duration > 0) {
        setTimeout(() => { if (el.isConnected) close(); }, duration);
      }
    }

    function handleAuthError(error) {
      const code = error?.code || "";
      switch (code) {
        case "auth/unauthorized-domain":
          showToast("Domain Not Authorized", `Add "${window.location.hostname || "this domain"}" in Firebase Console > Authentication > Authorized domains.`, "error", 6500);
          break;
        case "auth/popup-closed-by-user":
          showToast("Sign-In Cancelled", "Google sign-in popup was closed.", "info");
          break;
        case "auth/popup-blocked":
          showToast("Popup Blocked", "Allow popups in your browser to sign in with Google.", "error");
          break;
        case "auth/invalid-credential":
        case "auth/wrong-password":
        case "auth/user-not-found":
          showToast("Invalid Credentials", "Check your email and password and try again.", "error");
          break;
        case "auth/email-already-in-use":
          showToast("Account Exists", "This email is already registered. Switch to Sign In.", "info");
          break;
        case "auth/weak-password":
          showToast("Weak Password", "Password must be at least 6 characters.", "error");
          break;
        case "auth/invalid-email":
          showToast("Invalid Email", "Enter a valid email address.", "error");
          break;
        case "auth/too-many-requests":
          showToast("Too Many Attempts", "Please wait a moment and try again.", "error");
          break;
        default:
          showToast("Authentication Error", error?.message || "Unable to sign in.", "error");
      }
    }

    // =========================================================
    // 5. AUTH TAB & FORM CONTROLS
    // =========================================================
    function setAuthMode(mode) {
      authMode = mode;
      const isSignUp = mode === "signup";

      tabPill.style.transform = isSignUp ? "translateX(100%)" : "translateX(0%)";
      tabSignIn.setAttribute("aria-selected", String(!isSignUp));
      tabSignUp.setAttribute("aria-selected", String(isSignUp));

      tabSignIn.classList.toggle("text-[#f3f4f6]", !isSignUp);
      tabSignIn.classList.toggle("font-semibold", !isSignUp);
      tabSignIn.classList.toggle("text-[#9ca3af]", isSignUp);

      tabSignUp.classList.toggle("text-[#f3f4f6]", isSignUp);
      tabSignUp.classList.toggle("font-semibold", isSignUp);
      tabSignUp.classList.toggle("text-[#9ca3af]", !isSignUp);

      usernameCollapse.classList.toggle("open", isSignUp);
      forgotPasswordBtn.classList.toggle("hidden", isSignUp);
      submitBtnText.textContent = isSignUp ? "Create Account" : "Sign In";
      passwordInput.setAttribute("autocomplete", isSignUp ? "new-password" : "current-password");
    }

    tabSignIn.addEventListener("click", () => setAuthMode("signin"));
    tabSignUp.addEventListener("click", () => setAuthMode("signup"));

    togglePasswordBtn.addEventListener("click", () => {
      const hidden = passwordInput.type === "password";
      passwordInput.type = hidden ? "text" : "password";
      eyeOpenIcon.classList.toggle("hidden", hidden);
      eyeClosedIcon.classList.toggle("hidden", !hidden);
    });

    function setGoogleBusy(busy) {
      googleAuthBtn.disabled = busy;
      googleBtnText.innerHTML = busy
        ? `<span class="inline-flex items-center gap-2"><span class="spinner"></span> Connecting...</span>`
        : "Continue with Google";
    }

    function setSubmitBusy(busy) {
      submitAuthBtn.disabled = busy;
      if (busy) {
        submitBtnText.innerHTML = `<span class="inline-flex items-center gap-2"><span class="spinner"></span> ${authMode === "signup" ? "Creating Account..." : "Signing In..."}</span>`;
      } else {
        submitBtnText.textContent = authMode === "signup" ? "Create Account" : "Sign In";
      }
    }

    // =========================================================
    // 6. FIREBASE AUTH ACTIONS
    // =========================================================
    googleAuthBtn.addEventListener("click", async () => {
      setGoogleBusy(true);
      try {
        const res = await signInWithPopup(auth, googleProvider);
        showToast("Signed In", `Welcome, ${res.user.displayName || "Player"}.`, "success");
      } catch (err) {
        handleAuthError(err);
      } finally {
        setGoogleBusy(false);
      }
    });

    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const username = usernameInput.value.trim();

      if (!email || !password) {
        showToast("Missing Fields", "Enter your email and password.", "error");
        return;
      }

      if (authMode === "signup") {
        if (!username || username.length < 3) {
          showToast("Invalid Username", "Username must be at least 3 characters.", "error");
          usernameInput.focus();
          return;
        }
        if (password.length < 6) {
          showToast("Password Too Short", "Password must be at least 6 characters.", "error");
          passwordInput.focus();
          return;
        }
      }

      setSubmitBusy(true);
      try {
        if (authMode === "signup") {
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          await updateProfile(cred.user, { displayName: username });
          showToast("Account Created", `Welcome to GAMBIT, ${username}.`, "success");
          populateLobby({ displayName: username, email: cred.user.email, photoURL: cred.user.photoURL });
          sceneState.setScreen("lobby");
        } else {
          const cred = await signInWithEmailAndPassword(auth, email, password);
          const name = cred.user.displayName || cred.user.email.split("@")[0];
          showToast("Signed In", `Welcome back, ${name}.`, "success");
        }
      } catch (err) {
        handleAuthError(err);
      } finally {
        setSubmitBusy(false);
      }
    });

    forgotPasswordBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      if (!email) {
        showToast("Email Required", "Enter your email address first.", "info");
        emailInput.focus();
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        showToast("Reset Sent", `Password reset email sent to ${email}.`, "success");
      } catch (err) {
        handleAuthError(err);
      }
    });

    signOutBtn.addEventListener("click", async () => {
      try {
        await signOut(auth);
        showToast("Signed Out", "You have signed out of GAMBIT.", "info");
      } catch (err) {
        handleAuthError(err);
      }
    });

    // =========================================================
    // 7. AUTH STATE & LOBBY HYDRATION
    // =========================================================
    function getInitials(name) {
      if (!name) return "GM";
      const parts = name.trim().split(/[\s_]+/);
      return parts.length === 1
        ? parts[0].slice(0, 2).toUpperCase()
        : (parts[0][0] + parts[1][0]).toUpperCase();
    }

    function populateLobby(user) {
      const name = user.displayName || (user.email ? user.email.split("@")[0] : "Player");
      lobbyUserName.textContent = name;

      if (user.photoURL) {
        lobbyAvatarImg.src = user.photoURL;
        lobbyAvatarImg.classList.remove("hidden");
        lobbyAvatarInitials.classList.add("hidden");
        lobbyAvatarImg.onerror = () => {
          lobbyAvatarImg.classList.add("hidden");
          lobbyAvatarInitials.classList.remove("hidden");
          lobbyAvatarInitials.textContent = getInitials(name);
        };
      } else {
        lobbyAvatarImg.classList.add("hidden");
        lobbyAvatarInitials.classList.remove("hidden");
        lobbyAvatarInitials.textContent = getInitials(name);
      }
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        populateLobby(user);
        sceneState.setScreen("lobby");
      } else {
        sceneState.setScreen("auth");
      }
    });

    // Lobby Mode Selection
    document.querySelectorAll(".mode-card").forEach((card) => {
      card.addEventListener("click", () => {
        const mode = card.getAttribute("data-mode");
        showToast(mode, "Matchmaking ready to connect.", "info");
      });
    });
  </script>
</body>
</html>
